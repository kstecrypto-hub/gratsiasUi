<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webhook Sender</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #0f274a 0%, #070b14 55%, #020203 100%);
        color: #e8eefc;
        display: grid;
        place-items: center;
      }

      .panel {
        width: min(520px, 92vw);
        background: rgba(8, 16, 32, 0.86);
        border: 1px solid rgba(99, 135, 196, 0.25);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 18px;
        color: #b9c9ea;
      }

      .env-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        color: #d7e4ff;
      }

      select {
        background: #111c33;
        color: #e8eefc;
        border: 1px solid #2e4d86;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.95rem;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      button {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid transparent;
        color: #eef4ff;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
      }

      .email-btn {
        background: linear-gradient(180deg, #2e63be, #22498b);
        border-color: #4d7fd6;
      }

      .sms-btn {
        background: linear-gradient(180deg, #2f5ca0, #1f3e6f);
        border-color: #406db0;
      }

      .status {
        margin-top: 16px;
        min-height: 1.4em;
        color: #9ab7f0;
        font-size: 0.94rem;
      }

      .status.error {
        color: #ff9f9f;
      }

      .status.success {
        color: #91edbd;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Webhook Sender</h1>
      <p>Send an email or SMS webhook in your selected environment.</p>

      <label class="env-toggle" for="environment">
        Environment
        <select id="environment" aria-label="Environment selector">
          <option value="production" selected>Production</option>
          <option value="test">Test</option>
        </select>
      </label>

      <section class="actions">
        <button id="sendEmail" class="email-btn" type="button">Send Email</button>
        <button id="sendSms" class="sms-btn" type="button">Send SMS</button>
      </section>

      <div id="status" class="status" aria-live="polite"></div>
    </main>

    <script>
      const WEBHOOKS = {
        production: {
          email: 'http://localhost:49078/webhook/email',
          sms: 'http://localhost:49078/webhook/sms',
        },
        test: {
          email: 'http://localhost:49078/webhook-test/email',
          sms: 'http://localhost:49078/webhook-test/sms',
        },
      };

      const environmentSelect = document.getElementById('environment');
      const statusElement = document.getElementById('status');
      const buttons = {
        email: document.getElementById('sendEmail'),
        sms: document.getElementById('sendSms'),
      };

      function setStatus(message, variant = '') {
        statusElement.textContent = message;
        statusElement.className = `status ${variant}`.trim();
      }

      async function triggerWebhook(type) {
        const environment = environmentSelect.value;
        const url = WEBHOOKS[environment][type];

        setStatus(`Sending ${type.toUpperCase()} via ${environment}...`);

        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              channel: type,
              environment,
              sentAt: new Date().toISOString(),
            }),
          });

          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          setStatus(`✅ ${type.toUpperCase()} webhook sent to ${environment}.`, 'success');
        } catch (error) {
          setStatus(`❌ Could not send ${type.toUpperCase()} webhook: ${error.message}`, 'error');
        }
      }

      buttons.email.addEventListener('click', () => triggerWebhook('email'));
      buttons.sms.addEventListener('click', () => triggerWebhook('sms'));
    </script>
  </body>
</html>
